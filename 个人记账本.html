<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="application-name" content="记账本">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="学生个人复式记账：收入、支出分类、股票投资（FIFO）、花呗跨期与退款，借贷自动平衡">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>个人复式记账本</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e6e8eb; --line2:#f0f1f3;
    --t1:#1f2329; --t2:#646a73; --t3:#8f959e;
    --blue:#185FA5; --blue-bg:#e8f0fa;
    --up:#d03050; --down:#0f9d58;
    --amber:#8a5a00; --amber-bg:#fdf3e0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--t1);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px; line-height:1.6;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  .app{max-width:900px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:20px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--t2);font-size:13px;margin:0 0 18px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{
    border:1px solid var(--line);background:var(--card);color:var(--t2);
    padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;
  }
  .tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;margin:0 0 14px}
  .card h3{font-size:13px;font-weight:500;color:var(--t2);margin:16px 0 8px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--t2);margin-bottom:5px}
  input,select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;font-family:inherit;color:var(--t1);background:#fff;outline:none;
  }
  input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
  /* 手动粘贴导入用的多行文本框 */
  textarea.ta{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;font-family:ui-monospace,Consolas,"Courier New",monospace;color:var(--t1);
    background:#fff;outline:none;resize:vertical;line-height:1.5;
  }
  textarea.ta:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{
    border:1px solid var(--line);background:#fff;color:var(--t2);
    padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;
  }
  .seg button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
  .hint{font-size:12px;color:var(--blue);margin-top:6px}
  .hint.warn{color:var(--amber)}
  /* 格子计算器：输入算式待回车/失焦时，边框高亮提醒 */
  input.calc-expr{border-color:var(--amber) !important;background:#fffcf4}
  input.calc-bad{border-color:var(--up) !important;background:#fef6f7}
  .calc-row{display:flex;gap:8px;align-items:stretch}
  .calc-row input{flex:1 1 auto;width:auto;min-width:0}
  .calcbtn{
    flex:0 0 auto;width:42px;padding:0;border:1px solid var(--line);background:#fff;
    border-radius:8px;color:var(--blue);font-size:15px;font-family:inherit;cursor:pointer;
  }
  .calcbtn:hover{background:var(--blue-bg)}
  .calcpop{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
  .calcpop[hidden]{display:none}
  .calcpop-bg{position:absolute;inset:0;background:rgba(20,24,30,.42)}
  .calcpop-body{
    position:relative;width:100%;max-width:320px;background:var(--card);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.22);padding:14px;
  }
  .calcpop-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calcpop-top span{font-size:13px;color:var(--t2);font-weight:500}
  .calcpop-x{border:none;background:transparent;font-size:15px;color:var(--t3);cursor:pointer;padding:2px 6px}
  .calcpop-screen{
    background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    font-size:21px;text-align:right;min-height:52px;word-break:break-all;color:var(--t1);
  }
  .calcpop-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .calcpop-keys button{
    padding:0;height:46px;border:1px solid var(--line);background:#fff;border-radius:9px;
    font-size:17px;font-family:inherit;color:var(--t1);cursor:pointer;
  }
  .calcpop-keys button:active{background:var(--line2)}
  .calcpop-keys button.fn{color:var(--blue);background:var(--blue-bg);border-color:#d6e4f5}
  .calcpop-keys button.eq{background:var(--blue);border-color:var(--blue);color:#fff}
  .calcpop-foot{display:flex;gap:8px}
  .calcpop-foot button{
    flex:1;padding:11px;border-radius:9px;font-size:14px;font-family:inherit;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--t2);
  }
  .calcpop-foot button.primary2{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
  button.primary{
    width:100%;padding:11px;border:none;border-radius:9px;background:var(--blue);
    color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px;
  }
  button.primary:hover{background:#14508c}
  button.ghost{
    border:1px solid var(--line);background:#fff;color:var(--t2);padding:7px 14px;
    border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;
  }
  button.ghost:hover{border-color:#c9ccd1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line2)}
  th{color:var(--t2);font-weight:500;font-size:12px;background:#fafbfc}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .up{color:var(--up)}
  .down{color:var(--down)}
  .muted{color:var(--t3)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:150px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kpi .k{font-size:12px;color:var(--t2)}
  .kpi .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .bars{margin-top:4px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .bar-label{width:56px;font-size:12px;color:var(--t2);flex:none}
  .bar-track{flex:1;height:16px;background:var(--line2);border-radius:5px;overflow:hidden}
  .bar-fill{height:100%;background:#85b7eb;border-radius:5px}
  .bar-fill.neg{background:#8ed3a8}
  .bar-val{width:82px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  /* 支出占比：条形图末尾的百分比 + 明细表里的占比列 */
  .bar-pct{width:46px;text-align:right;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}
  .pct{font-variant-numeric:tabular-nums;color:var(--t2)}
  .pct.top{color:var(--blue);font-weight:600}
  .pctbar{display:inline-block;vertical-align:middle;width:46px;height:6px;margin-right:6px;
    background:var(--line2);border-radius:3px;overflow:hidden}
  .pctbar>i{display:block;height:100%;background:#85b7eb;border-radius:3px}
  .pctbar>i.neg{background:#8ed3a8}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--line2);color:var(--t2)}
  .tag.income{background:#fbe9ec;color:var(--up)}
  .tag.expense{background:#e6f4ec;color:var(--down)}
  .tag.invest{background:var(--blue-bg);color:var(--blue)}
  .tag.debt{background:var(--amber-bg);color:var(--amber)}
  .tag.refund{background:#f0ecfa;color:#6b4fbb}
  .tag.recv{background:#e3f3ef;color:#0f6e56}
  .empty{color:var(--t3);font-size:13px;padding:20px 0;text-align:center}
  .note-box{background:#fafbfc;border-left:3px solid var(--blue);padding:10px 14px;border-radius:6px;
    font-size:12.5px;color:var(--t2);margin-top:14px}
  .disc{font-size:12px;color:var(--t3);margin-top:22px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);
    background:#1f2329;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:1}
  .del{border:none;background:none;color:var(--t3);cursor:pointer;font-size:13px;font-family:inherit}
  .del:hover{color:var(--up)}
  .edit{border:none;background:none;color:var(--blue);cursor:pointer;font-size:13px;font-family:inherit;margin-right:8px}
  .edit:hover{text-decoration:underline}
  td.act{white-space:nowrap;text-align:right}

  /* ---------- 流水编辑弹层 ---------- */
  .editpop{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
  .editpop[hidden]{display:none}
  .editpop-bg{position:absolute;inset:0;background:rgba(20,24,30,.42)}
  .editpop-body{
    position:relative;width:100%;max-width:430px;max-height:90vh;display:flex;flex-direction:column;
    background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);
  }
  .editpop-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  .editpop-top span{font-size:14px;font-weight:600;color:var(--t1)}
  .editpop-x{border:none;background:transparent;font-size:15px;color:var(--t3);cursor:pointer;padding:2px 6px}
  .editpop-form{overflow-y:auto;padding:0 16px 4px;-webkit-overflow-scrolling:touch}
  .editpop-form .field{margin-bottom:11px}
  .editpop-foot{display:flex;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line2)}
  .editpop-foot button{
    flex:1;padding:11px;border-radius:9px;font-size:14px;font-family:inherit;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--t2);
  }
  .editpop-foot button.primary2{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
  .editpop .typerow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);padding:2px 0 10px}

  /* ---------- 备份提醒条 ---------- */
  #backupTip:empty{display:none}
  .tip-banner{
    background:var(--amber-bg);border:1px solid #f0dcb4;border-radius:10px;
    padding:11px 13px;font-size:12.5px;color:var(--amber);margin-bottom:12px;
    display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  }
  .tip-banner button{
    border:1px solid #e3c893;background:#fff;color:var(--amber);border-radius:7px;
    padding:7px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;flex:none;
  }

  /* ---------- 移动端适配 ---------- */
  .tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px;margin-bottom:10px}
  @media(max-width:600px){
    .app{padding:calc(12px + env(safe-area-inset-top)) 12px calc(44px + env(safe-area-inset-bottom))}
    h1{font-size:18px}
    .sub{font-size:12.5px;margin-bottom:14px}
    .tabs{gap:5px}
    .tabs button{padding:9px 13px;min-height:40px;font-size:12.5px}
    .card{padding:15px;border-radius:11px}
    input,select{font-size:16px;padding:10px 11px}   /* iOS 上小于 16px 会自动放大整页 */
    .seg button{padding:10px 14px;min-height:42px}
    button.primary{padding:14px;font-size:15px;min-height:50px}
    button.ghost{padding:10px 14px;min-height:42px}
    .del{padding:8px 6px;font-size:13px}
    table{font-size:12.5px}
    th,td{padding:8px 6px}
    .bar-label{width:42px;font-size:11.5px}
    .bar-val{width:74px}
    .bar-pct{width:40px;font-size:11px}
    .pctbar{display:none}
    .kpi{padding:11px 12px}
    .kpi .v{font-size:18px}
    .row{gap:10px}
    .row>*{min-width:130px}
    .disc{font-size:11.5px}
    .toast{bottom:calc(24px + env(safe-area-inset-bottom));max-width:88%;text-align:center}
  }
  @media(max-width:380px){
    .tabs button{padding:8px 10px;font-size:12px}
    .bar-label{width:38px}
  }
</style>
</head>
<body>
<div class="app">
  <h1>个人复式记账本</h1>
  <p class="sub">你只管记一笔，科目自动归位 · 有借必有贷，账自动平</p>

  <nav class="tabs" id="tabs">
    <button data-tab="entry" class="active">记一笔</button>
    <button data-tab="list">流水</button>
    <button data-tab="report">月度报表</button>
    <button data-tab="assets">资产总览</button>
    <button data-tab="setup">设置</button>
  </nav>

  <section id="entryPanel" class="panel">
    <div id="backupTip"></div>
    <div class="card">
      <h2>记一笔</h2>
      <div class="field">
        <label>日期</label>
        <input type="date" id="f_date">
      </div>
      <div class="field">
        <label>类型</label>
        <div class="seg" id="f_type">
          <button data-v="expense" class="on">支出</button>
          <button data-v="income">收入</button>
          <button data-v="buy">买入证券</button>
          <button data-v="sell">卖出证券</button>
          <button data-v="refund">退款</button>
          <button data-v="borrow">借入</button>
          <button data-v="repay">还款</button>
          <button data-v="lend">借出</button>
          <button data-v="collect">收回</button>
        </div>
      </div>
      <div class="field">
        <label id="f_amountLabel">金额（元）</label>
        <div class="calc-row">
          <input type="text" id="f_amount" data-calc placeholder="0.00 或算式 12+8*3" inputmode="decimal" autocomplete="off">
          <button type="button" class="calcbtn" data-calc-open="f_amount" title="打开计算器">＝</button>
        </div>
        <div class="hint" style="font-size:11.5px">格子里能直接敲算式：<b>12+8*3</b>、<b>(120-20)/4</b>、<b>1000*1.05</b> —— 回车或点别处自动变成结果</div>
      </div>
      <div class="field" id="f_payWrap" style="display:none">
        <label>支付方式</label>
        <select id="f_pay">
          <option value="bank">银行卡 / 微信 / 支付宝余额（钱当场就出去了）</option>
          <option value="credit">花呗 / 信用卡（先欠着，下月还）</option>
        </select>
      </div>
      <div class="field" id="f_refundWrap" style="display:none">
        <label>退款去向</label>
        <select id="f_refundTo">
          <option value="bank">退回银行卡 / 微信 / 支付宝余额（原来是用银行卡付的）</option>
          <option value="credit">冲抵花呗 / 信用卡欠款（原来是用花呗付的）</option>
        </select>
      </div>
      <div class="field" id="f_symbolWrap" style="display:none">
        <label>标的代码 <span class="muted">（必填，如 510300）</span></label>
        <input type="text" id="f_symbol" list="symbolList" placeholder="510300" autocomplete="off" autocapitalize="off" spellcheck="false">
        <datalist id="symbolList"></datalist>
      </div>
      <div class="field" id="f_symNameWrap" style="display:none">
        <label>标的名称 <span class="muted">（选填，如 沪深300ETF）</span></label>
        <input type="text" id="f_symName" placeholder="沪深300ETF" autocomplete="off">
      </div>
      <div class="field" id="f_sharesWrap" style="display:none">
        <label id="f_sharesLabel">数量</label>
        <div class="calc-row">
          <input type="text" id="f_shares" data-calc placeholder="如 1000 或 1234.56" inputmode="decimal" autocomplete="off">
          <button type="button" class="calcbtn" data-calc-open="f_shares" title="打开计算器">＝</button>
        </div>
      </div>
      <div class="field" id="f_costWrap" style="display:none">
        <label>卖出部分的买入成本（元）<span class="muted">— 已按 FIFO 自动算好，可手动覆盖</span></label>
        <div class="calc-row">
          <input type="text" id="f_cost" data-calc placeholder="0.00" inputmode="decimal" autocomplete="off">
          <button type="button" class="calcbtn" data-calc-open="f_cost" title="打开计算器">＝</button>
        </div>
      </div>
      <div class="field" id="f_noteWrap">
        <label>说明</label>
        <input type="text" id="f_note" placeholder="如：食堂午饭 15 / 买教材 68 / 地铁 4">
      </div>
      <div class="field" id="f_catWrap">
        <label>科目<span class="muted">（自动识别，可手动改）</span></label>
        <select id="f_cat"></select>
      </div>
      <div class="hint" id="f_rule">识别规则：说明里出现关键词即自动归类</div>
      <button class="primary" id="f_submit">记一笔</button>
    </div>
    <div class="card" id="entryPreview"></div>
  </section>

  <main id="view" style="display:none"></main>

  <p class="disc">
    ⚠️ 本工具由 AI 基于用户提供的数据和公开规则自动生成，仅供参考，不构成正式会计意见或审计结论。
    数据保存在本机浏览器，请定期在「设置」中导出备份。最终账务处理须由持证会计师或 controller 复核签核。
  </p>
</div>
<div class="toast" id="toast"></div>

<!-- 迷你计算器：手机端数字键盘敲不出 + * ，用这个补位 -->
<div class="calcpop" id="calcPop" hidden>
  <div class="calcpop-bg" data-calc-close></div>
  <div class="calcpop-body">
    <div class="calcpop-top"><span id="calcPopTitle">计算器</span><button type="button" class="calcpop-x" data-calc-close>✕</button></div>
    <div class="calcpop-screen" id="calcPopScreen">0</div>
    <div class="calcpop-keys" id="calcPopKeys">
      <button type="button" data-k="C" class="fn">C</button>
      <button type="button" data-k="(" class="fn">(</button>
      <button type="button" data-k=")" class="fn">)</button>
      <button type="button" data-k="÷" class="fn">÷</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" data-k="×" class="fn">×</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="-" class="fn">−</button>
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="+" class="fn">+</button>
      <button type="button" data-k="0">0</button>
      <button type="button" data-k=".">.</button>
      <button type="button" data-k="←" class="fn">←</button>
      <button type="button" data-k="=" class="eq">=</button>
    </div>
    <div class="calcpop-foot">
      <button type="button" class="ghost" data-calc-close>取消</button>
      <button type="button" class="primary2" id="calcPopOk">填入格子</button>
    </div>
  </div>
</div>

<!-- 流水编辑弹层 -->
<div class="editpop" id="editPop" hidden>
  <div class="editpop-bg" data-edit-close></div>
  <div class="editpop-body">
    <div class="editpop-top">
      <span id="editPopTitle">编辑这笔</span>
      <button type="button" class="editpop-x" data-edit-close aria-label="关闭">✕</button>
    </div>
    <div class="editpop-form" id="editPopForm"></div>
    <div class="editpop-foot">
      <button type="button" data-edit-close>取消</button>
      <button type="button" class="primary2" id="editPopSave">保存修改</button>
    </div>
  </div>

/* 老格式兼容迁移：单一持仓 / 单一总市值 / 单一券商成本价 → 逐只结构。
 * 读本地存档和「导入旧备份文件」都走这里，保证从更早版本导出来的账本也能正确还原。 */
function migrateDatabase(d){
  if(!d) d = { version:5, opening:null, txs:[], marketPrices:{}, brokerPrices:{}, securityNames:{} };
  if(!d.txs) d.txs = [];
  if(!d.securityNames) d.securityNames = {};

  if(!d.marketPrices) d.marketPrices = {};
  if(d.lastBackup === undefined) d.lastBackup = null;

  if(d.opening){
    if(!d.opening.positions){
      d.opening.positions = [];
      var mss = Number(d.opening.stockShares)||0;
      var msc = Number(d.opening.stockCost)||0;
      if(mss > 0){
        d.opening.positions.push({ symbol:'', shares:mss, cost:msc });
        if(d.stockMarket != null) d.marketPrices['未分类'] = Number(d.stockMarket) / mss;
      }
    }
    delete d.opening.stockCost;
    delete d.opening.stockShares;
    if(d.opening.receivable === undefined) d.opening.receivable = 0;
  }
  if(d.brokerCostPrice != null) d.brokerPrices['未分类'] = Number(d.brokerCostPrice);
  delete d.brokerCostPrice;
  delete d.stockMarket;
  d.version = 5;
  return d;
}

/* ===================== 工具 ===================== */
function fmt(n){
  n = Number(n)||0;
  return '¥' + n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function classify(note){

function toast(msg){

/* 距某日期过去多少天（按本地日期算） */
function daysSince(dateStr){
  var a = new Date(String(dateStr) + 'T00:00:00');
  if(isNaN(a.getTime())) return 0;
  var b = new Date(todayStr() + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

/* ===================== 格子计算器：数字框里可直接敲算式 =====================
   12+8*3      → 36          (120-20)/4   → 25
   1000*1.05   → 1050        36.5-4.5     → 32
   支持中文全角 ＋－×÷（）、千分位逗号、百分号；回车或点到别处即回填结果。
   不使用 eval —— 自带四则运算解析器，只认数字和运算符，杜绝注入。 */
function normExpr(s){
  return String(s == null ? '' : s)
    .replace(/[\uFF10-\uFF19]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 65248); })
    .replace(/\uFF0B/g, '+')
    .replace(/[\uFF0D\u2212\u2013\u2014\u2015]/g, '-')
    .replace(/[\u00D7\u2715\u2716\uFF58xX]/g, '*')
    .replace(/[\u00F7\uFF0F]/g, '/')
    .replace(/\uFF08/g, '(').replace(/\uFF09/g, ')')
    .replace(/\uFF05/g, '%')
    .replace(/\uFF0E/g, '.')
    /* 逗号只在「千分位」位置上才剥离：1,234.56 → 1234.56；而 1,5 这种原样留着好报错，
       不能悄悄当成 15（那是最典型的静默错误） */
    .replace(/(\d)[,\uFF0C](?=\d{3}(?!\d))/g, '$1')
    .replace(/[\s\u3000]+/g, '');
}

/* 是否含运算符（不含则按纯数字处理） */
function isExpr(s){ return /[-+*/%()\u00D7\u00F7\uFF0B\uFF0D\uFF08\uFF09]/.test(String(s == null ? '' : s)); }

/* 四则运算解析器：expr → term → unary → postfix(%) → primary */
function evalExpr(src){
  var s = src, i = 0;
  function peek(){ return s.charAt(i); }
  function primary(){
    if(peek() === '('){
      i++;
      var v = expr();
      if(peek() !== ')') throw new Error('括号不配对');
      i++;
      return v;
    }
    var m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
    if(!m) throw new Error('位置 ' + (i + 1) + ' 处识别不了');
    i += m[0].length;
    return parseFloat(m[0]);
  }
  function postfix(){
    var v = primary();
    while(peek() === '%'){ i++; v = v / 100; }
    return v;
  }
  function unary(){
    if(peek() === '-'){ i++; return -unary(); }
    if(peek() === '+'){ i++; return unary(); }
    return postfix();
  }
  function term(){
    var v = unary();
    while(peek() === '*' || peek() === '/'){
      var op = s.charAt(i++), r = unary();
      if(op === '/'){ if(r === 0) throw new Error('除数不能为 0'); v = v / r; }
      else v = v * r;
    }
    return v;
  }
  function expr(){
    var v = term();
    while(peek() === '+' || peek() === '-'){
      var op = s.charAt(i++), r = term();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  var out = expr();
  if(i < s.length) throw new Error('多出了「' + s.slice(i) + '」');
  if(!isFinite(out)) throw new Error('结果不是有效数字');
  return out;
}

/* 修掉浮点尾巴：0.1+0.2 → 0.3 而不是 0.30000000000000004 */
function round6(v){ return Math.round(v * 1e6) / 1e6; }

/* 有没有哪个「数字片段」里塞了不止一个小数点（1.5.5 这种） */
function dotOverflow(e){
  var parts = String(e).split(/[+\-*/%()\u00D7\u00F7]/);
  for(var i = 0; i < parts.length; i++){
    if((parts[i].match(/\./g) || []).length > 1) return true;
  }
  return false;
}
var DOT_MSG = '小数点多于一个 —— 一个数字只能有一个小数点；要算两个小数相加，请写成 1.5+2.5';

/* 解析一个格子的内容 → {ok, val, expr, msg} */
function calcField(raw){
  var s = String(raw == null ? '' : raw).trim();
  if(s === '') return { ok:true, val:null, expr:false };
  var e = normExpr(s);
  if(!isExpr(e)){
    /* 纯数字：允许 1. / .5 这种悬空写法（parseFloat 一样读得出），只要求至少有一位数字 */
    if(!/^\d*\.?\d*$/.test(e) || !/\d/.test(e)){
      return { ok:false, msg: dotOverflow(e) ? DOT_MSG : '「' + s + '」不是有效数字' };
    }
    return { ok:true, val:parseFloat(e), expr:false };
  }
  try { return { ok:true, val:round6(evalExpr(e)), expr:true, src:e }; }
  catch(err){ return { ok:false, msg: dotOverflow(e) ? DOT_MSG : err.message }; }
}

/* 读一个格子里的数值（支持算式），读不出就返回 dflt */
function readNum(el, dflt){
  if(typeof el === 'string') el = document.getElementById(el);
  var d = (dflt === undefined) ? 0 : dflt;
  if(!el) return d;
  var r = calcField(el.value);
  return (r.ok && r.val != null) ? r.val : d;
}

/* 把格子里的算式算出来并回填；silent = 不弹提示 */
function applyCalc(el, silent){
  if(!el || !el.getAttribute || !el.hasAttribute('data-calc')) return false;
  var raw = String(el.value == null ? '' : el.value);
  el.classList.remove('calc-expr');
  el.classList.remove('calc-bad');
  if(raw.trim() === '') return true;
  var r = calcField(raw);
  if(!r.ok){
    if(!silent) toast('算式没算对：' + r.msg);
    return false;
  }
  var nv = String(round6(r.val));
  if(nv !== raw){
    el.value = nv;
    if(r.expr && !silent) toast(normExpr(raw) + ' = ' + nv);
  }
  return true;
}

/* 把当前视图里所有待结算的算式格子先算掉 */
function flushCalcs(scope){
  var root = scope || document;
  [].slice.call(root.querySelectorAll('input[data-calc]')).forEach(function(el){ applyCalc(el, true); });
}

/* 全局委托：回车 / 失焦即结算，输入算式时边框高亮 */
document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el && el.hasAttribute && el.hasAttribute('data-calc')) applyCalc(el);
}, true);
document.addEventListener('focusout', function(e){
  var el = e.target;
  if(el && el.hasAttribute && el.hasAttribute('data-calc')) applyCalc(el);
}, true);
document.addEventListener('input', function(e){
  var el = e.target;
  if(el && el.hasAttribute && el.hasAttribute('data-calc')){
    var e2 = normExpr(el.value);
    if(dotOverflow(e2)){                 // 一个小数里敲了两个点 → 立刻红框，别等失焦才骂人
      el.classList.add('calc-bad'); el.classList.remove('calc-expr');
    } else if(isExpr(e2)){
      el.classList.add('calc-expr'); el.classList.remove('calc-bad');
    } else {
      el.classList.remove('calc-expr'); el.classList.remove('calc-bad');
    }
  }
}, true);

/* ---------- 迷你计算器浮层 ----------
   手机端 inputmode="decimal" 的数字键盘没有 + − × ÷，用这个补位；
   表达式仍走同一个 evalExpr，结果口径完全一致。 */
var calcTargetId = null, calcBuf = '';
function calcScreen(msg){
  var s = document.getElementById('calcPopScreen');
  if(s) s.textContent = msg;
}
function openCalcFor(id){
  var el = document.getElementById(id);
  if(!el) return;
  calcTargetId = id;
  var raw = String(el.value == null ? '' : el.value).trim();
  calcBuf = raw ? normExpr(raw) : '';
  calcScreen(calcBuf || '0');
  var pop = document.getElementById('calcPop');
  if(pop) pop.hidden = false;
}
function closeCalc(){
  var pop = document.getElementById('calcPop');
  if(pop) pop.hidden = true;
  calcTargetId = null;
}
function pressCalcKey(k){
  if(k === 'C'){ calcBuf = ''; return calcScreen('0'); }
  if(k === '←'){ calcBuf = calcBuf.slice(0, -1); return calcScreen(calcBuf || '0'); }
  if(k === '='){
    var r = calcField(calcBuf);
    if(!r.ok) return calcScreen('算不了：' + r.msg);
    if(r.val == null) return calcScreen('0');
    calcBuf = String(round6(r.val));
    return calcScreen(calcBuf);
  }
  if(k === '\u2212') k = '-';
  if(k === '.'){
    var tail = calcBuf.split(/[+\-*/%()\u00D7\u00F7]/).pop();   // 当前正在输入的那一个数
    if(tail.indexOf('.') >= 0) return;                          // 这个数已有小数点 → 静默忽略（标准计算器行为）
    if(tail === '') k = '0.';                                   // 前一位是运算符或空 → 补成 0.
  }
  calcBuf += k;
  calcScreen(calcBuf);
}
function applyCalcPop(){
  var el = document.getElementById(calcTargetId);
  if(!el){ closeCalc(); return; }
  var r = calcField(calcBuf);
  if(!r.ok){ toast('算式没算对：' + r.msg); return; }
  el.value = (r.val == null) ? '' : String(round6(r.val));
  el.classList.remove('calc-expr');
  closeCalc();
  el.dispatchEvent(new Event('input', { bubbles:true }));    // 触发卖出成本 / 账实核对等联动
  el.dispatchEvent(new Event('change', { bubbles:true }));
}
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var op = t.closest('[data-calc-open]');
  if(op){ openCalcFor(op.getAttribute('data-calc-open')); return; }
  if(t.closest('[data-calc-close]')){ closeCalc(); return; }
  var key = t.closest('#calcPopKeys button');
  if(key){ pressCalcKey(key.getAttribute('data-k')); return; }
  if(t.id === 'calcPopOk'){ applyCalcPop(); }
});
document.addEventListener('keydown', function(e){
  var pop = document.getElementById('calcPop');
  if(e.key === 'Escape' && pop && !pop.hidden) closeCalc();
});

/* ===================== 计算 ===================== */
function opening(){ return db.opening || {bank:0, receivable:0, positions:[], debt:0}; }

/* ---------- 标的（证券）辅助：每只股票 = 一个独立核算单元 ---------- */
function symKey(obj){
  var s = String((obj && obj.symbol) || '').trim();
  return s || '未分类';
}
function secName(sym){
  if(!sym || sym === '未分类') return '';
  return (db.securityNames && db.securityNames[sym]) || '';
}
function symLabel(sym){
  if(!sym || sym === '未分类') return '未分类';
  var n = secName(sym);
  return n ? (sym + ' ' + n) : sym;
}
function registerName(sym, name){
  if(!db.securityNames) db.securityNames = {};
  var n = String(name||'').trim();
  if(sym && sym !== '未分类' && n) db.securityNames[sym] = n;
}
function knownSymbols(){
  var set = {};
  (opening().positions||[]).forEach(function(p){ var s = String(p.symbol||'').trim(); if(s) set[s] = 1; });
  db.txs.forEach(function(t){ if((t.type==='buy' || t.type==='sell') && t.symbol) set[String(t.symbol).trim()] = 1; });
  return Object.keys(set).sort();
}
function priceOf(sym){
  var p = db.marketPrices ? db.marketPrices[sym] : null;
  if(p == null || p === '' || isNaN(Number(p))) return null;
  return Number(p);
}
function brokerPerOf(sym){
  var p = db.brokerPrices ? db.brokerPrices[sym] : null;
  if(p == null || p === '' || isNaN(Number(p))) return null;
  return Number(p);
}

/* 单笔交易对账面与报表的影响 —— calc 与 monthReport 共用同一套规则，避免两处口径打架 */
function txEffect(t, ctx){
  var a = Number(t.amount)||0;
  if(ctx.receivable === undefined) ctx.receivable = 0;
  if(ctx.debt === undefined) ctx.debt = 0;
  var e = { bank:0, debt:0, receivable:0, stockCost:0, realized:0, income:0, expense:0, cashIn:0, cashOut:0 };
  if(t.type === 'income'){
    e.bank = a; e.income = a; e.cashIn = a;
  }else if(t.type === 'expense'){
    e.expense = a;
    if(t.pay === 'credit'){ e.debt = a; }          // 花呗消费：挂负债，钱没当场出去
    else { e.bank = -a; e.cashOut = a; }
  }else if(t.type === 'buy'){
    e.bank = -a; e.stockCost = a; e.cashOut = a;
  }else if(t.type === 'sell'){
    var c = Number(t.cost)||0;
    e.bank = a; e.stockCost = -c; e.realized = a - c; e.cashIn = a;
  }else if(t.type === 'borrow'){
    e.bank = a; e.debt = a; e.cashIn = a;
  }else if(t.type === 'repay'){
    e.bank = -a; e.debt = -a; e.cashOut = a;
  }else if(t.type === 'refund'){
    e.expense = -a;                                 // 退款冲减费用，而不是算作收入
    if((t.refundTo || 'bank') === 'credit'){
      var use = Math.min(Math.max(ctx.debt, 0), a); // 先冲抵花呗欠款
      e.debt = -use;
      e.bank = a - use;                             // 欠款已还清的部分，退回银行卡
      e.cashIn = a - use;
    }else{
      e.bank = a; e.cashIn = a;
    }
  }else if(t.type === 'lend'){
    /* 借出（国债逆回购、借给他人）：资产内部转换——银行存款 → 其他应收款，不是支出 */
    e.bank = -a; e.receivable = a; e.cashOut = a;
  }else if(t.type === 'collect'){
    /* 收回：先冲减应收款本金，超出部分 = 利息，记已实现投资收益 */
    var useR = Math.min(Math.max(ctx.receivable, 0), a);
    e.receivable = -useR;
    e.realized = a - useR;
    e.bank = a; e.cashIn = a;
  }
  ctx.debt += e.debt;
  ctx.receivable += e.receivable;
  return e;
}

function calc(){
  var o = opening();
  var ctx = { debt: Number(o.debt)||0, receivable: Number(o.receivable)||0 };
  var bank = Number(o.bank)||0;
  var realized = 0, incomeTotal = 0, expenseTotal = 0;

  db.txs.forEach(function(t){
    var e = txEffect(t, ctx);
    bank += e.bank;
    realized += e.realized; incomeTotal += e.income; expenseTotal += e.expense;
  });
  var debt = ctx.debt;
  var receivable = ctx.receivable;

  var st = stockAnalytics();          // 持仓成本一律以「分标的 FIFO 批次引擎」为唯一口径
  var stockCost = st.fifoCost;
  var market = st.market;
  var floatPL = market - stockCost;
  var assets = bank + receivable + market;
  var net = assets - debt;

  return {
    bank:bank, receivable:receivable, stockCost:stockCost, stockMarket:market, floatPL:floatPL,
    debt:debt, assets:assets, net:net,
    realized:realized, incomeTotal:incomeTotal, expenseTotal:expenseTotal,
    analytics:st
  };
}

/* ---------- 股票批次引擎：FIFO / 加权平均 / 摊薄 三口径 ---------- */
function sortedTxs(){
  return db.txs.slice().sort(function(a,b){
    if(a.date === b.date) return 0;
    return a.date < b.date ? -1 : 1;
  });
}
function consume(lots, need){
  var cost = 0;
  while(need > 1e-9 && lots.length){
    var lot = lots[0];
    var unit = lot.shares > 0 ? lot.cost / lot.shares : 0;
    var take = Math.min(lot.shares, need);
    cost += unit * take;
    lot.cost -= unit * take;
    lot.shares -= take;
    need -= take;
    if(lot.shares <= 1e-9) lots.shift();
  }
  return cost;
}
/* 按标的（证券）分组建批次：每只股票一条独立队列，互不串号
   excludeId：编辑卖出记录时把这笔自己排除掉，否则会按「已经卖过一次」重算，成本必然算错 */
function buildLotsBySymbol(excludeId){
  var map = {};
  function bucket(sym){
    if(!map[sym]) map[sym] = { symbol:sym, lots:[], gap:0 };
    return map[sym];
  }
  (opening().positions||[]).forEach(function(p){
    var sym = symKey(p);
    var sh = Number(p.shares)||0;
    if(sh > 0) bucket(sym).lots.push({ shares:sh, cost:Number(p.cost)||0 });
  });
  sortedTxs().forEach(function(t){
    if(t.type !== 'buy' && t.type !== 'sell') return;
    if(excludeId && t.id === excludeId) return;
    var b = bucket(symKey(t));
    var sh = Number(t.shares)||0;
    if(t.type === 'buy'){
      if(sh > 0) b.lots.push({ shares:sh, cost:Number(t.amount)||0 });
      else b.gap++;
    }else{
      if(sh > 0) consume(b.lots, sh);
      else { b.gap++; consume(b.lots, b.lots.reduce(function(a,l){return a+l.shares;},0)); }
    }
  });
  return map;
}
function fifoCostForSell(symbol, shares, excludeId){
  var map = buildLotsBySymbol(excludeId);
  var b = map[symbol || '未分类'];
  if(!b) return 0;
  var copy = b.lots.map(function(l){ return { shares:l.shares, cost:l.cost }; });
  return consume(copy, Number(shares)||0);
}
/* 逐只核算 + 组合汇总 */
function stockAnalytics(){
  var o = opening();
  var lotMap = buildLotsBySymbol();
  var rows = {}, order = [];

  function row(sym){
    if(!rows[sym]){
      rows[sym] = { symbol:sym, name:secName(sym), shares:0, fifoCost:0,
                    buyTotal:0, sellNet:0, sellCost:0, realized:0,
                    avgCost:0, avgShares:0, gap:0 };
      order.push(sym);
    }
    return rows[sym];
  }

  (o.positions||[]).forEach(function(p){
    var r = row(symKey(p));
    var sh = Number(p.shares)||0, c = Number(p.cost)||0;
    r.buyTotal += c;
    r.avgCost += c; r.avgShares += sh;
  });

  sortedTxs().forEach(function(t){
    if(t.type !== 'buy' && t.type !== 'sell') return;
    var r = row(symKey(t));
    var amt = Number(t.amount)||0, sh = Number(t.shares)||0;
    if(t.type === 'buy'){
      r.buyTotal += amt;
      r.avgCost += amt; r.avgShares += sh;
    }else{
      r.sellNet += amt;
      r.sellCost += (Number(t.cost)||0);
      r.realized += amt - (Number(t.cost)||0);
      var take = (sh > 0) ? Math.min(sh, r.avgShares) : r.avgShares;
      var u = r.avgShares > 0 ? r.avgCost / r.avgShares : 0;
      r.avgCost -= u * take; r.avgShares -= take;
      if(r.avgCost < 0.005) r.avgCost = 0;
    }
  });

  Object.keys(lotMap).forEach(function(sym){
    var r = row(sym);
    lotMap[sym].lots.forEach(function(l){ r.shares += l.shares; r.fifoCost += l.cost; });
    r.gap = lotMap[sym].gap;
  });

  var list = order.map(function(sym){
    var r = rows[sym];
    r.shares = Math.round(r.shares * 10000) / 10000;
    r.avgShares = Math.round(r.avgShares * 10000) / 10000;
    var price = priceOf(sym);
    r.price = price;
    r.priced = (price != null);
    r.market = r.priced ? (r.shares * price) : r.fifoCost;   // 没填现价就按成本估值，浮盈记 0
    r.floatPL = r.market - r.fifoCost;
    r.fifoPer = r.shares > 0 ? r.fifoCost / r.shares : 0;
    r.avgPer = r.avgShares > 0 ? r.avgCost / r.avgShares : 0;
    r.dilutedPer = r.shares > 0 ? (r.buyTotal - r.sellNet) / r.shares : 0;
    r.dilutedCost = r.dilutedPer * r.shares;
    r.brokerPer = brokerPerOf(sym);
    r.cleared = (r.shares <= 1e-9);
    return r;
  });

  var agg = { shares:0, fifoCost:0, market:0, floatPL:0, realized:0,
              avgCost:0, dilutedCost:0, gap:0 };
  var held = [], cleared = [];
  list.forEach(function(r){
    agg.shares += r.shares; agg.fifoCost += r.fifoCost; agg.market += r.market;
    agg.floatPL += r.floatPL; agg.realized += r.realized;
    agg.avgCost += r.avgCost; agg.dilutedCost += r.dilutedCost; agg.gap += r.gap;
    (r.cleared ? cleared : held).push(r);
  });
  var byMkt = function(a,b){ return b.market - a.market; };
  held.sort(byMkt); cleared.sort(byMkt);
  list.sort(byMkt);

  return {
    list:list, held:held, cleared:cleared,
    unpriced: held.filter(function(r){ return !r.priced; }).map(function(r){ return r.symbol; }),
    shares:agg.shares, fifoCost:agg.fifoCost,
    fifoPer:agg.shares > 0 ? agg.fifoCost/agg.shares : 0,
    avgCost:agg.avgCost, avgPer:agg.shares > 0 ? agg.avgCost/agg.shares : 0,
    dilutedCost:agg.dilutedCost, dilutedPer:agg.shares > 0 ? agg.dilutedCost/agg.shares : 0,
    market:agg.market, floatPL:agg.floatPL, realized:agg.realized, gap:agg.gap
  };
}

function monthOf(dateStr){ return String(dateStr||'').slice(0,7); }

function monthReport(ym){
  var ctx = { debt: Number(opening().debt)||0, receivable: Number(opening().receivable)||0 };
  var rows = [], inc = {}, exp = {}, realized = 0, incT = 0, expT = 0;
  var cashIn = 0, cashOut = 0, refundT = 0;
  db.txs.forEach(function(t){
    var e = txEffect(t, ctx);                       // 全量走一遍，保证负债轨迹正确
    if(monthOf(t.date) !== ym) return;
    rows.push(t);
    incT += e.income; expT += e.expense; realized += e.realized;
    cashIn += e.cashIn; cashOut += e.cashOut;
    if(t.type === 'refund') refundT += Number(t.amount)||0;
    if(e.income){ var ki = t.category || '其他收入'; inc[ki] = (inc[ki]||0) + e.income; }
    if(e.expense){ var ke = t.category || '其他'; exp[ke] = (exp[ke]||0) + e.expense; }
  });
  return {rows:rows, inc:inc, exp:exp, realized:realized, incT:incT, expT:expT,
          cashIn:cashIn, cashOut:cashOut, refundT:refundT, surplus:incT - expT + realized};
}

function allMonths(){
  var set = {};
  db.txs.forEach(function(t){ var m = monthOf(t.date); if(m) set[m] = 1; });
  var cur = todayStr().slice(0,7);
  set[cur] = 1;
  return Object.keys(set).sort().reverse();
}

function updateSellCost(){
  if(fType !== 'sell') return;
  var sh = readNum('f_shares', NaN);
  var sym = String((document.getElementById('f_symbol').value)||'').trim();
  var f = document.getElementById('f_cost');
  if(!(sh > 0) || !sym){ return; }
  var c = fifoCostForSell(sym, sh);      // 只在本只股票的队列里结转
  f.value = (Math.round(c * 100) / 100).toFixed(2);
}

function autoDetect(){
  var rule = document.getElementById('f_rule');
  if(fType === 'expense' || fType === 'refund'){
    var note = document.getElementById('f_note').value;
    var cat = classify(note);
    var sel = document.getElementById('f_cat');
    if([].slice.call(sel.options).some(function(o){return o.value===cat;})) sel.value = cat;
    if(!note){
      rule.textContent = (fType === 'refund')
        ? '识别规则：说明里写清退的是什么东西（如“退了教材”），自动冲减对应科目'
        : '识别规则：说明里出现关键词即自动归类';
      rule.className='hint';
    }
    else if(cat === '其他'){
      rule.textContent = '未识别到关键词，已归入「其他」——可在上方手动改';
      rule.className='hint warn';
    }
    else {
      rule.textContent = (fType === 'refund')
        ? '✓ 退的是「'+cat+'」，将冲减本月该科目支出（不计入收入）'
        : '✓ 已识别为「'+cat+'」';
      rule.className='hint';
    }
  }else if(fType === 'income'){
    rule.textContent = '收入类：请选择来源，金额计入本月收入';
    rule.className='hint';
  }else if(fType === 'buy'){
    var bsym = String((document.getElementById('f_symbol').value)||'').trim();
    if(!bsym){
      rule.textContent = '先填标的代码（必填）。金额填含手续费的实际付出（场外基金就是支付宝实际扣款）；数量填股数或份额，场外基金可带小数。';
      rule.className = 'hint warn';
    }else{
      rule.textContent = '买入 '+symLabel(bsym)+' → 只进这只标的自己的队列，不影响其他持仓';
      rule.className = 'hint';
    }
  }else if(fType === 'sell'){
    var ssym = String((document.getElementById('f_symbol').value)||'').trim();
    var wsh = readNum('f_shares', 0);
    var curSh = 0;
    if(ssym && knownSymbols().indexOf(ssym) >= 0){
      var rec = stockAnalytics().list.filter(function(r){ return r.symbol === ssym; })[0];
      curSh = rec ? rec.shares : 0;
    }
    if(!ssym){
      rule.textContent = '先填标的代码，才能在这只标的自己的队列里按 FIFO 结转成本。';
      rule.className = 'hint warn';
    }else if(knownSymbols().indexOf(ssym) < 0){
      rule.textContent = '「'+ssym+'」还没有买入或期初持仓记录，结转成本会是 0 —— 请确认代码没写错。';
      rule.className = 'hint warn';
    }else if(wsh > 0 && wsh > curSh + 1e-9){
      rule.textContent = '⚠️ 卖出 '+wsh+'，超过「'+symLabel(ssym)+'」当前持仓 '+curSh+'，结转成本会不足，请核对。';
      rule.className = 'hint warn';
    }else{
      rule.textContent = '卖出 '+symLabel(ssym)+' → 只在本只标的的队列里 FIFO 结转（先卖它最早那批），不动别的持仓';
      rule.className = 'hint';
    }
  }else if(fType === 'lend'){
    rule.textContent = '借出（国债逆回购 / 借给他人）= 资产内部转换：银行存款 → 其他应收款，不计支出。当前未收回 '+fmt(calc().receivable)+'。';
    rule.className = 'hint';
  }else if(fType === 'collect'){
    rule.textContent = '填实际到账金额：程序先冲减应收款本金，超出部分记为投资收益（利息）。当前未收回 '+fmt(calc().receivable)+'。';
    rule.className = 'hint';
  }else{
    rule.textContent = '借入 / 还款只影响负债和银行存款，不进收支表';
    rule.className='hint';
  }
}

function submitEntry(){
  flushCalcs();                       // 先把还没结算的算式格子算掉（12+8*3 → 36）
  var date = document.getElementById('f_date').value || todayStr();
  var amount = readNum('f_amount', NaN);
  if(!(amount > 0)){ toast('请填写大于 0 的金额'); return; }

  var note = document.getElementById('f_note').value.trim();
  var cat = document.getElementById('f_cat').value;
  var shares = readNum('f_shares', NaN);
  var tx = { id:uid(), date:date, type:fType, amount:amount, note:note, category:'' };

  if(fType === 'expense'){
    tx.category = cat;
    tx.pay = document.getElementById('f_pay').value;
  }
  if(fType === 'income'){ tx.category = cat; }

  if(fType === 'refund'){
    tx.category = cat;                                        // 被冲减的支出科目
    tx.refundTo = document.getElementById('f_refundTo').value;
  }

  if(fType === 'buy' || fType === 'sell'){
    var sym = String(document.getElementById('f_symbol').value||'').trim();
    if(!sym){ toast('请填写标的代码（如 510300）'); return; }
    if(!(shares > 0)){ toast('请填写数量（股数或份额，用于 FIFO 建批次 / 结转成本）'); return; }
    tx.symbol = sym;                                  // 标的 = 独立核算单元
    tx.category = '股票投资';
    tx.shares = shares;
    registerName(sym, document.getElementById('f_symName').value);
    if(fType === 'sell'){
      var cost = readNum('f_cost', NaN);
      if(isNaN(cost)) cost = fifoCostForSell(sym, shares);   // 只在本标的队列内结转
      tx.cost = cost;
    }
  }

  if(fType === 'borrow' || fType === 'repay'){ tx.category = '负债'; }
  if(fType === 'lend' || fType === 'collect'){ tx.category = '债权'; }

  var recvBefore = calc().receivable;          // 记账前的应收款余额，用于提示本次利息

  db.txs.push(tx);
  save();
  document.getElementById('f_amount').value = '';
  document.getElementById('f_note').value = '';
  document.getElementById('f_cost').value = '';
  document.getElementById('f_shares').value = '';
  document.getElementById('f_pay').value = 'bank';
  document.getElementById('f_refundTo').value = 'bank';
  refreshSymbolList();
  autoDetect();
  updateSellCost();

  var msg = '已记账：' + TYPE_LABEL[fType] + ' ' + fmt(amount);
  if(fType === 'expense' || fType === 'income') msg += ' → ' + cat;
  if(fType === 'expense' && tx.pay === 'credit') msg += '（挂花呗，欠款计入负债）';
  if(fType === 'refund') msg += ' → 冲减「'+cat+'」（'+(tx.refundTo==='credit'?'冲抵花呗欠款':'退回银行卡')+'）';
  if(fType === 'buy') msg += ' → ' + symLabel(tx.symbol);
  if(fType === 'sell') msg += ' → ' + symLabel(tx.symbol) + ' 已实现盈亏 ' + fmt(amount - tx.cost);
  if(fType === 'lend') msg += ' → 转入其他应收款（未收回 ' + fmt(recvBefore + amount) + '）';
  if(fType === 'collect'){
    var interest = amount - Math.min(Math.max(recvBefore, 0), amount);
    msg += interest > 0.005 ? (' → 其中利息 ' + fmt(interest)) : ' → 冲减应收款';
  }
  toast(msg);
  renderEntryPreview();
}

/* ===================== 流水编辑 =====================
   能改哪些格子，按类型决定：
     · 日期 / 金额 / 说明 —— 九种类型全都能改
     · 科目 —— 支出、收入、退款能改（支出和退款共用一张支出科目表）
     · 支付方式 —— 只有支出有；退款去向 —— 只有退款有
     · 标的 / 名称 / 数量 / 结转成本 —— 只有买入、卖出有
     · 借入还债借出收回的科目是固定值，不给改
   类型本身不给改：不同类型牵连的账务处理完全不同，
   就地改类型比删了重记更容易把账改乱。 */

  if(isStock){
    html += '<div class="field"><label>标的代码</label>' +
            '<input type="text" id="e_symbol" list="symbolList" value="'+esc(t.symbol||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false"></div>';
    html += '<div class="field"><label>标的名称 <span class="muted">（选填）</span></label>' +
            '<input type="text" id="e_symName" value="'+esc((db.securityNames||{})[t.symbol]||'')+'" autocomplete="off"></div>';
    html += '<div class="field"><label>数量（股 / 份）</label>' +
            '<div class="calc-row">' +
            '<input type="text" id="e_shares" data-calc inputmode="decimal" autocomplete="off" value="'+esc(t.shares)+'">' +
            '<button type="button" class="calcbtn" data-calc-open="e_shares" title="打开计算器">＝</button>' +
            '</div></div>';
    if(t.type === 'sell'){
      html += '<div class="field"><label>结转成本（元）<span class="muted">· 改数量会按 FIFO 自动重算</span></label>' +
              '<div class="calc-row">' +
              '<input type="text" id="e_cost" data-calc inputmode="decimal" autocomplete="off" value="'+esc(t.cost == null ? '' : t.cost)+'">' +
              '<button type="button" class="calcbtn" data-calc-open="e_cost" title="打开计算器">＝</button>' +
              '</div></div>';
      html += '<div class="hint" id="e_costHint"></div>';
    }
  }

  if(t.type === 'borrow' || t.type === 'repay' || t.type === 'lend' || t.type === 'collect'){
    html += '<div class="hint">这笔的科目固定为「'+esc(t.category||'—')+'」，改金额就会跟着改负债 / 应收款余额。</div>';
  }

  document.getElementById('editPopTitle').textContent = '编辑 · ' + TYPE_LABEL[t.type] + ' ' + fmt(t.amount);
  document.getElementById('editPopForm').innerHTML = html;
  document.getElementById('editPop').hidden = false;

  if(t.type === 'sell'){
    var costTouched = false;
    var costEl = document.getElementById('e_cost');
    var hintEl = document.getElementById('e_costHint');
    var refreshHint = function(){
      var sym = String(document.getElementById('e_symbol').value||'').trim();
      var sh = readNum('e_shares', NaN);
      if(!sym || !(sh > 0)){ hintEl.textContent = '填上标的和数量，就能算出这笔该结转多少成本。'; return; }
      var ref = fifoCostForSell(sym, sh, editId);
      hintEl.textContent = '按 FIFO（不含这一笔）应结转 ' + fmt(ref) + '；' +
        (sh > 0 ? '单位成本 ' + fmt(ref/sh) : '') + '。数量改了没动成本的话会自动跟过去。';
      return ref;
    };
    var syncCost = function(){
      if(costTouched){ refreshHint(); return; }
      var sym = String(document.getElementById('e_symbol').value||'').trim();
      var sh = readNum('e_shares', NaN);
      if(sym && sh > 0){
        var ref = fifoCostForSell(sym, sh, editId);
        document.getElementById('e_cost').value = ref.toFixed(2);
      }
      refreshHint();
    };
    costEl.addEventListener('input', function(){ costTouched = true; refreshHint(); });
    document.getElementById('e_shares').addEventListener('input', syncCost);
    document.getElementById('e_shares').addEventListener('change', syncCost);
    document.getElementById('e_symbol').addEventListener('input', syncCost);
    document.getElementById('e_symbol').addEventListener('change', syncCost);
    refreshHint();
  }
}

function closeEdit(){
  var pop = document.getElementById('editPop');
  if(pop) pop.hidden = true;
  editId = null;
}

function saveEdit(){
  var t = null;
  db.txs.forEach(function(x){ if(x.id === editId) t = x; });
  if(!t){ closeEdit(); return; }

  var form = document.getElementById('editPopForm');
  flushCalcs(form);

  var date = String(document.getElementById('e_date').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('日期没填对'); return; }

  var amount = readNum('e_amount', NaN);
  if(!(amount > 0)){ toast('金额要填大于 0 的数'); return; }

  var note = String(document.getElementById('e_note').value||'').trim();
  var oldMonth = monthOf(t.date);

  /* 先把要改的值全读出来，全部校验通过后才写回去，
     免得校验中途失败、账已经被改了一半 */
  var next = { date:date, amount:amount, note:note };
  var catEl = document.getElementById('e_cat');
  if(catEl) next.category = catEl.value;

  var payEl = document.getElementById('e_pay');
  if(payEl) next.pay = payEl.value;

  var refundEl = document.getElementById('e_refundTo');
  if(refundEl) next.refundTo = refundEl.value;

  if(t.type === 'buy' || t.type === 'sell'){
    var sym = String(document.getElementById('e_symbol').value||'').trim();
    if(!sym){ toast('标的代码不能空'); return; }
    var shares = readNum('e_shares', NaN);
    if(!(shares > 0)){ toast('数量要填大于 0 的数'); return; }
    var nm = String(document.getElementById('e_symName').value||'').trim();
    next.symbol = sym;
    next.shares = shares;
    next.category = '股票投资';
    if(t.type === 'sell'){
      var cost = readNum('e_cost', NaN);
      if(isNaN(cost)) cost = fifoCostForSell(sym, shares, t.id);
      next.cost = cost;
    }
    registerName(sym, nm);
  }

  Object.keys(next).forEach(function(k){ t[k] = next[k]; });
  save();
  closeEdit();

  var newMonth = monthOf(t.date);
  var msg = '已改好：' + TYPE_LABEL[t.type] + ' ' + fmt(t.amount);
  if(newMonth !== oldMonth){
    msg += '（已移到 ' + newMonth + ' 的账里）';
    window.__listMonth = newMonth;          // 日期改到别的月，就跟着过去，别让这行凭空消失
  }
  toast(msg);
  if(curTab === 'list') renderList();
  else if(curTab === 'report') renderReport();
  else if(curTab === 'assets') renderAssets();
  renderEntryPreview();
}

/* 弹层关闭 / 保存：走事件委托，弹层里的按钮是后生成的，绑不上 onclick */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  if(t.id === 'editPopSave'){ saveEdit(); return; }
  if(t.closest('[data-edit-close]')){ closeEdit(); return; }
  var btn = t.closest('[data-edit]');
  if(btn){ openEdit(btn.getAttribute('data-edit')); return; }
});
document.addEventListener('keydown', function(e){
  var pop = document.getElementById('editPop');
  if(e.key === 'Escape' && pop && !pop.hidden) closeEdit();
});

  var cur = window.__listMonth || months[0];
  var rows = db.txs.filter(function(t){ return t.date.slice(0,7) === cur; })
                    .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  var r = monthReport(cur);

  var html = '<div class="card"><h2>流水 · '+cur+'</h2>';
  html += '<div class="field" style="max-width:200px"><label>选择月份</label><select id="listMonth">' +
    months.map(function(m){ return '<option'+(m===cur?' selected':'')+'>'+m+'</option>'; }).join('') +
    '</select></div>';

  if(!rows.length){
    html += '<div class="empty">这个月还没有记录</div>';
  }else{
    html += '<table><thead><tr><th>日期</th><th>类型</th><th>科目</th><th>说明</th><th class="num">金额</th><th></th></tr></thead><tbody>';
    rows.forEach(function(t){
      var cls = (t.type==='income') ? 'up' : (t.type==='expense' || t.type==='refund' || t.type==='repay') ? 'down' : '';
      var amt;
      if(t.type==='expense' || t.type==='repay' || t.type==='lend') amt = '-'+fmt(t.amount);
      else if(t.type==='refund' || t.type==='borrow' || t.type==='collect') amt = '+'+fmt(t.amount);
      else amt = fmt(t.amount);
      var catTxt;
      if(t.type==='buy' || t.type==='sell'){
        catTxt = esc(symLabel(symKey(t)));
        if(t.shares) catTxt += ' <span class="muted">'+t.shares.toLocaleString('zh-CN')+' 股/份</span>';
        if(t.type==='sell' && t.cost != null) catTxt += ' <span class="muted">成本'+fmt(t.cost)+'</span>';
      }else{
        catTxt = esc(t.category||'—');
        if(t.type==='expense' && t.pay==='credit') catTxt += ' <span class="tag debt">花呗·信用卡</span>';
        if(t.type==='refund') catTxt += ' <span class="tag refund">'+(t.refundTo==='credit'?'冲抵花呗':'退回银行卡')+'</span>';
      }
      html += '<tr>' +
        '<td class="muted">'+esc(t.date.slice(5))+'</td>' +
        '<td>'+tagOf(t)+'</td>' +
        '<td>'+catTxt+'</td>' +
        '<td>'+esc(t.note||'—')+'</td>' +
        '<td class="num '+cls+'">'+amt+'</td>' +
        '<td class="act"><button class="edit" data-edit="'+t.id+'">编辑</button>' +
        '<button class="del" data-del="'+t.id+'">删除</button></td>' +
      '</tr>';
    });
    html += '</tbody></table>';
    html += '<div class="hint">点「编辑」可改日期、金额、说明、科目；买券卖券的还能改标的和数量。类型不能改，记错类型请删掉重记。</div>';
  }
  html += '<div class="note-box">本月收入 '+fmt(r.incT)+' ；本月支出 '+fmt(r.expT)+
          ' ；本月结余 '+fmt(r.surplus)+'（含已实现投资收益 '+fmt(r.realized)+'）</div>';
  html += '</div>';

  document.getElementById('view').innerHTML = html;
  document.getElementById('listMonth').onchange = function(){ window.__listMonth = this.value; renderList(); };
  [].slice.call(document.querySelectorAll('[data-del]')).forEach(function(b){
    b.onclick = function(){
      var id = this.getAttribute('data-del');
      db.txs = db.txs.filter(function(t){ return t.id !== id; });
      save(); renderList(); toast('已删除');
    };
  });
}

function renderReport(){
  var months = allMonths();
  var cur = window.__repMonth || months[0];
  var r = monthReport(cur);

  var expKeys = Object.keys(r.exp).sort(function(a,b){ return r.exp[b]-r.exp[a]; });
  var maxExp = 1;
  expKeys.forEach(function(k){ maxExp = Math.max(maxExp, Math.abs(r.exp[k])); });

  var html = '<div class="card"><h2>月度损益表 · '+cur+'</h2>';
  html += '<div class="field" style="max-width:200px"><label>选择月份</label><select id="repMonth">' +
    months.map(function(m){ return '<option'+(m===cur?' selected':'')+'>'+m+'</option>'; }).join('') +
    '</select></div>';

  html += '<div class="kpis">' +
    '<div class="kpi"><div class="k">收入合计</div><div class="v up">'+fmt(r.incT)+'</div></div>' +
    '<div class="kpi"><div class="k">费用合计</div><div class="v down">'+fmt(r.expT)+'</div></div>' +
    '<div class="kpi"><div class="k">已实现投资收益</div><div class="v '+(r.realized>=0?'up':'down')+'">'+fmt(r.realized)+'</div></div>' +
    '<div class="kpi"><div class="k">本月结余</div><div class="v '+(r.surplus>=0?'up':'down')+'">'+fmt(r.surplus)+'</div></div>' +
  '</div>';

  html += '<h3>收入明细</h3>';
  if(Object.keys(r.inc).length){
    html += '<table><tbody>';
    Object.keys(r.inc).forEach(function(k){
      html += '<tr><td>'+esc(k)+'</td><td class="num up">'+fmt(r.inc[k])+'</td></tr>';
    });
    html += '<tr><td><b>合计</b></td><td class="num up"><b>'+fmt(r.incT)+'</b></td></tr></tbody></table>';
  }else{ html += '<div class="empty">本月无收入记录</div>'; }

  html += '<h3>支出明细（按类别）</h3>';
  if(r.refundT){
    html += '<div class="hint">本月含退款冲减 '+fmt(r.refundT)+
            '，已从对应科目中扣除（不计入收入）。若某科目本月支出少于退款额，会显示为负数。</div>';
  }
  if(expKeys.length){
    /* 占比的基数：各类支出取绝对值相加。
       没有退款时它就等于费用合计；有退款冲减出负数科目时也不会算出负占比。 */
    var shareBase = 0;
    expKeys.forEach(function(k){ shareBase += Math.abs(r.exp[k]); });
    var hasNeg = expKeys.some(function(k){ return r.exp[k] < 0; });

    html += '<div class="bars">';
    expKeys.forEach(function(k){
      var v = r.exp[k];
      var pct = Math.abs(v)/maxExp*100;
      html += '<div class="bar-row"><span class="bar-label">'+esc(k)+'</span>' +
        '<div class="bar-track"><div class="bar-fill'+(v<0?' neg':'')+'" style="width:'+pct.toFixed(1)+'%"></div></div>' +
        '<span class="bar-pct">'+(shareBase ? (Math.abs(v)/shareBase*100).toFixed(1)+'%' : '—')+'</span>' +
        '<span class="bar-val down">'+fmt(v)+'</span></div>';
    });
    html += '</div>';

    html += '<table style="margin-top:12px"><thead><tr><th>科目</th><th class="num" style="width:120px">占比</th><th class="num">金额</th></tr></thead><tbody>';
    expKeys.forEach(function(k, i){
      var ratio = shareBase ? (Math.abs(r.exp[k])/shareBase*100) : 0;
      var barW = Math.min(100, ratio);
      html += '<tr><td>'+esc(k)+'</td>' +
        '<td class="num">' +
          '<span class="pctbar"><i class="'+(r.exp[k]<0?'neg':'')+'" style="width:'+barW.toFixed(1)+'%"></i></span>' +
          '<span class="pct'+(i===0?' top':'')+'">'+ratio.toFixed(1)+'%</span>' +
        '</td>' +
        '<td class="num down">'+fmt(r.exp[k])+'</td></tr>';
    });
    html += '<tr><td><b>合计</b></td><td class="num muted">100%</td>' +
            '<td class="num down"><b>'+fmt(r.expT)+'</b></td></tr></tbody></table>';

    var top = expKeys[0];
    var topRatio = shareBase ? (Math.abs(r.exp[top])/shareBase*100) : 0;
    html += '<div class="hint">占比 = 该科目支出 ÷ 各类支出合计；本月支出最多的是「'+esc(top)+
            '」，占 '+(topRatio.toFixed(1))+'%。'+
            (hasNeg ? '（本月有退款冲减，个别科目为负，占比按绝对值算）' : '')+'</div>';
  }else{ html += '<div class="empty">本月无支出记录</div>'; }

  html += '<div class="note-box"><b>平账公式：</b>本月结余 = 收入 '+fmt(r.incT)+' − 费用 '+fmt(r.expT)+
          ' + 已实现投资收益 '+fmt(r.realized)+' = <b>'+fmt(r.surplus)+'</b>'+
          (r.refundT ? '（费用已扣减退款冲减 '+fmt(r.refundT)+'）' : '') + '<br>'+
          '净现金流 = 流入 '+fmt(r.cashIn)+' − 流出 '+fmt(r.cashOut)+' = '+fmt(r.cashIn - r.cashOut)+
          '（含买卖股票、借贷，不等于结余）</div>';
  html += '</div>';

  document.getElementById('view').innerHTML = html;
  document.getElementById('repMonth').onchange = function(){ window.__repMonth = this.value; renderReport(); };
}

  var rowOf = function(label, per, cost){

function syncPosFromDom(){
  var rows = [].slice.call(document.querySelectorAll('[data-pos]'));
  if(!rows.length) return;
  var map = {};
  rows.forEach(function(inp){
    var i = Number(inp.getAttribute('data-i'));

  window.__poss = Object.keys(map).sort(function(a,b){ return a-b; }).map(function(k){ return map[k]; });
}

/* ===================== 原生能力桥 =====================
 * 同一份源码要跑在三种环境里：浏览器直接打开、PWA 添加到主屏幕、安卓 App（Capacitor）。
 * 只有安卓 App 里才存在 window.Capacitor.isNativePlatform，其余环境所有原生分支自动跳过，
 * 行为与加入本段之前完全一致 —— 也就是说这里不会破坏已经装好的 PWA 版本。
 */
var Native = (function(){
  var cap = window.Capacitor;
  var isApp = !!(cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform());
  return {
    isApp: isApp,
    platform: isApp ? cap.getPlatform() : 'web',
    plugin: function(name){
      return (isApp && cap.Plugins && cap.Plugins[name]) || null;
    }
  };
})();

/* 导出文件。
 * 浏览器 / PWA：走 Blob 下载（原逻辑）。
 * 安卓 App：WebView 里 <a download> 不会触发系统下载，必须改走原生文件系统，
 *          写好后调起系统分享面板，由用户决定存到网盘还是发给自己。
 * 这条路径是数据安全的命脉 —— 账本只存在本机，导出是唯一的逃生通道。
 */
function download(name, content, type){
  var FS = Native.plugin('Filesystem');
  if(FS && typeof FS.writeFile === 'function'){
    var b64;
    try{ b64 = btoa(unescape(encodeURIComponent(content))); }
    catch(e){ toast('内容编码失败：' + e.message); return; }
    /* 写进 CACHE 目录：无需任何存储权限，必定成功；再交给系统分享面板另存 */
    FS.writeFile({ path: name, data: b64, directory: 'CACHE' })
      .then(function(res){
        var SH = Native.plugin('Share');
        if(SH && typeof SH.share === 'function' && res && res.uri){
          SH.share({
            title: name,
            files: [res.uri],
            dialogTitle: '保存备份到网盘 / 发给自己'
          })
            .then(function(){ toast('备份已导出：' + name); })
            .catch(function(){ toast('备份已生成，未分享：' + name); });
        }else{
          toast('备份已导出：' + name);
        }
      })
      .catch(function(err){
        toast('导出失败：' + ((err && err.message) || err));
      });
    return;
  }
  var blob = new Blob([content], {type:type+';charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* 导出 JSON 备份（同时记录备份日期，用于备份提醒） */
function exportJson(){

  download('记账备份_'+todayStr()+'.json', JSON.stringify(db, null, 2), 'application/json');
  renderBackupTip();

/* ===================== 导入 =====================
 * 导入是「整库覆盖」，不可在原文件上回退，所以做了三层保护：
 *   1. 先解析校验，格式不对就直接拦下，不碰现有数据；
 *   2. 库里已有记录时先弹确认（把「当前几笔 / 导入几笔 / 来自哪个文件」摆出来）；
 *   3. 覆盖前把旧账本另存到一个独立的撤销槽，设置页可一键退回。
 * 撤销槽存在单独的 localStorage 键里，不混进 db，导出的备份文件不会因此变胖。
 */
var UNDO_STORE = 'pl_ledger_undo';
function readUndo(){ try{ return localStorage.getItem(UNDO_STORE); }catch(e){ return null; } }
function hasUndo(){ return !!readUndo(); }
function writeUndo(s){ try{ localStorage.setItem(UNDO_STORE, s); }catch(e){} }
function clearUndo(){ try{ localStorage.removeItem(UNDO_STORE); }catch(e){} }

function applyImportText(text, label){
  text = String(text == null ? '' : text).trim();
  if(!text){ toast('没拿到内容 —— 先选中备份文件，或把 json 粘贴到输入框'); return; }

  var d;
  try{ d = JSON.parse(text); }
  catch(err){ toast('这不是合法的 JSON，导入失败（原数据未改动）'); return; }

  if(Object.prototype.toString.call(d) === '[object Array]') d = { txs:d };
  if(!d || Object.prototype.toString.call(d.txs) !== '[object Array]'){
    toast('文件里没有记录列表（缺少 txs），导入失败'); return;
  }

  var oldN = db.txs.length, newN = d.txs.length;
  if(oldN){
    if(!confirm('导入会用备份整库覆盖当前账本：\n\n' +
                '当前账本：' + oldN + ' 笔记录\n' +
                '即将导入：' + newN + ' 笔记录（' + (label || '备份文件') + '）\n\n' +
                '导入前的账本会自动留一份，之后可在设置里「撤销上次导入」。确定继续？')){
      toast('已取消，数据未改动');
      return;
    }
  }

  writeUndo(JSON.stringify(db));

  var next = { version:5, opening:null, txs:[], marketPrices:{}, brokerPrices:{}, securityNames:{}, lastBackup:null };
  for(var k in d){ if(Object.prototype.hasOwnProperty.call(d, k)) next[k] = d[k]; }
  db = migrateDatabase(next);                 // 旧格式备份在这里被补成当前结构
  save();

  var held = (db.opening && db.opening.positions) ? db.opening.positions.length : 0;
  toast('导入成功：' + db.txs.length + ' 笔记录 · 期初持仓 ' + held + ' 只');
  renderSetup(); renderEntryPreview(); refreshSymbolList();
}

/* 复制备份文本到剪贴板。
 * 手机浏览器（尤其用 file:// 打开的页面）有时会拦下载，这时「复制」就是唯一出口：
 * 复制 → 粘到备忘录 / 发给自己 → 在 App 的「手动粘贴导入」里粘回来。
 */
function copyText(txt, okMsg){
  function fallback(){
    try{
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly','');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ta.setSelectionRange(0, txt.length);
      var ok = document.execCommand('copy');
      ta.remove();
      toast(ok ? (okMsg || '已复制') : '复制失败，请改用「导出备份」存文件');
    }catch(e){ toast('复制失败，请改用「导出备份」存文件'); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg || '已复制'); }, fallback);
  }else{
    fallback();
  }
}
function copyBackup(){
  db.lastBackup = todayStr();
  save();
  copyText(JSON.stringify(db, null, 2), '备份已复制到剪贴板，粘贴保存即可');
  renderBackupTip();
}

/* 备份提醒条：手机浏览器长期不用可能清理本地数据，超过 7 天未备份就提醒 */
function renderBackupTip(){
  var box = document.getElementById('backupTip');
  if(!box) return;
  if(!db.txs.length){ box.innerHTML = ''; return; }
  var msg = '';
  if(!db.lastBackup){
    msg = '还没有导出过备份。手机浏览器在长期不用后可能清理本地数据，建议现在导出一次存好。';
  }else{
    var d = daysSince(db.lastBackup);
    if(d >= 7) msg = '距上次备份已 '+d+' 天（上次 '+db.lastBackup+'）。建议导出一次备份，避免手机清理数据导致账本丢失。';
  }
  box.innerHTML = msg
    ? '<div class="tip-banner"><span>⚠️ '+esc(msg)+'</span><button id="tipBackup">立即导出备份</button></div>'
    : '';
  var btn = document.getElementById('tipBackup');
  if(btn) btn.onclick = function(){
    exportJson();
    toast('备份已导出，记得存到网盘或发给自己');
  };
}

/* ===================== 标签切换 ===================== */
var curTab = 'entry';
function switchTab(tab){
  curTab = tab;
  [].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
  document.getElementById('entryPanel').style.display = (tab === 'entry') ? '' : 'none';
  document.getElementById('view').style.display = (tab === 'entry') ? 'none' : '';
  if(tab === 'list') renderList();
  else if(tab === 'report') renderReport();
  else if(tab === 'assets') renderAssets();
  else if(tab === 'setup') renderSetup();
  else { renderEntryPreview(); renderBackupTip(); }
}

  load();
  document.getElementById('f_date').value = todayStr();

  [].slice.call(document.querySelectorAll('#f_type button')).forEach(function(b){
    b.onclick = function(){
      [].slice.call(document.querySelectorAll('#f_type button')).forEach(function(x){ x.classList.remove('on'); });
      this.classList.add('on');
      fType = this.getAttribute('data-v');
      refreshCatOptions();
    };
  });
  document.getElementById('f_note').addEventListener('input', autoDetect);
  document.getElementById('f_shares').addEventListener('input', function(){ updateSellCost(); autoDetect(); });
  document.getElementById('f_shares').addEventListener('keydown', function(e){
    if(e.key === 'Enter') submitEntry();
  });
  document.getElementById('f_cat').addEventListener('change', function(){
    document.getElementById('f_rule').textContent = '已手动指定为「'+this.value+'」';
    document.getElementById('f_rule').className = 'hint';
  });
  document.getElementById('f_submit').onclick = submitEntry;
  document.getElementById('f_amount').addEventListener('keydown', function(e){
    if(e.key === 'Enter') submitEntry();
  });
  document.getElementById('f_note').addEventListener('keydown', function(e){
    if(e.key === 'Enter') submitEntry();
  });
  [].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){
    b.onclick = function(){ switchTab(this.getAttribute('data-tab')); };
  });

  if(!db.opening){
    db.opening = { bank:0, receivable:0, positions:[], debt:0 };
    save();
  }
  document.getElementById('f_symbol').addEventListener('input', function(){
    updateSellCost(); autoDetect();
  });
  refreshCatOptions();
  renderEntryPreview();
  renderBackupTip();

  /* 安卓物理返回键：系统默认会直接杀掉 App，必须接管。
   * 规则：不在「记一笔」页 → 先回到记一笔；已在首页 → 提示后 2 秒内再按才退出。 */
  (function hookBack(){
    var App = Native.plugin('App');
    if(!App || typeof App.addListener !== 'function') return;
    var armed = null;
    App.addListener('backButton', function(){
      if(curTab !== 'entry'){ switchTab('entry'); return; }
      if(armed){
        clearTimeout(armed); armed = null;
        if(typeof App.exitApp === 'function') App.exitApp();
        return;
      }
      toast('再按一次返回键退出');
      armed = setTimeout(function(){ armed = null; }, 2000);
    });
  })();
})();

/* ===================== 注册 Service Worker（仅 https / localhost 生效） ===================== */
(function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(Native.isApp) return;  // App 内资源全在安装包里，注册 SW 只会导致改版后仍跑旧缓存
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return;  // file:// 下跳过，不影响使用
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){ /* 注册失败不影响记账 */ });
  });
})();
